[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-manager"
version = "0.1.0"
description = "Contract management system"
requires-python = ">=3.12"
dependencies = [
    "django~=6.0.2",
    "strawberry-graphql-django~=0.75.1",
    "psycopg[binary]~=3.3.2",
    "django-environ~=0.13.0",
    "django-auditlog~=3.4.1",
    "django-cors-headers~=4.9.0",
    "gunicorn~=25.1.0",
    "uvicorn~=0.41.0",
    "httpx~=0.28.1",
    "pyjwt~=2.11.0",
    "rapidfuzz~=3.14.3",
    "openpyxl~=3.1.5",
    "python-dateutil~=2.9.0",
    "weasyprint~=68.1",
    "drafthorse~=2025.2.0",
    "anthropic~=0.81.0",
    "redis~=6.4.0",
    "mt-940~=4.30.0",
    "django-storages[s3]~=1.14.6",
    "boto3~=1.42.51",
    "celery[redis]~=5.6.2",
    "msal~=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.0.2",
    "pytest-django~=4.12.0",
    "pytest-cov~=7.0.0",
    "ruff~=0.15.1",
    "mypy~=1.19.1",
    "django-stubs~=5.2.9",
    "django-extensions~=4.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.local"

[tool.setuptools]
# Django project - no packages to discover
packages = []
