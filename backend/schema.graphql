  attachments: [ContractAttachmentType!]!
  links: [ContractLinkType!]!
  todos: [TodoItemType!]!
  orderConfirmation: OrderConfirmationType
  timeTrackingMappingsCount: Int!
  effectiveEndDate: Date
  durationMonths: Int!
  remainingMonths: Int!
