  billingAlignmentDate: Date
  minDurationMonths: Int
  noticePeriodMonths: Int!
  noticePeriodAnchor: String!

  """
  Notice period after minimum duration ends (if different from notice_period_months)
  """
  noticePeriodAfterMinMonths: Int
